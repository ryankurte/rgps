[package]
name = "gpsrs-daemon"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.98"
serde = { version = "1.0.189", features = [ "derive" ] }
toml = { version = "0.9.5" }
serde_json = "1.0"
clap = { version = "4.5.42", features = ["derive", "env"] }
strum = { version = "0.27.2", features = ["derive"] }
tokio = { version = "*", features = [ "full" ] }
futures = "0.3"
tracing = { version = "0.1.41", features = ["log"] }
tracing-subscriber = { version = "0.3.17", features = ["fmt", "env-filter"] }


geoutils = { version = "0.5.1", features = [ "serde" ] }
isocountry = "*"
rust_iso3166 = "0.1.14"
bytes = "*"
reqwest = { version = "*" }
hyper = { version = "*", features = [ "full" ] }
hyper-util = { version = "*", features = [ "full" ] }

http = "*"
crc-any = "*"
bytebuffer = "*"
base64 = "*"
tokio-rustls = "*"
rustls = "*"
webpki-roots = "1.0.2"
thiserror = "1.0"

serialport5 = "5.0.2"
tokio-serial = "*"

gpsrs-proto = "0.1.0"

rtcm-rs = { version = "0.11.0", features=["serde"] }
gnss-rs = "2.4.1"
gnss-protos = { version = "0.0.2", features = [ "gps" ] }
ublox = { version = "0.6", default-features = false, features = ["std", "sfrbx-gps", "ubx_proto23"] }
nmea = { version = "0.7.0", features = ["serde"] }

[[bin]]
name = "gps-tool"
path = "src/bin/gps.rs"

[[bin]]
name = "ntrip-tool"
path = "src/bin/ntrip.rs"
