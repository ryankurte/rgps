[package]
name = "gpsrs-daemon"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.98"
serde = { version = "1.0.189", features = [ "derive" ] }
toml = { version = "0.9.5" }
serde_json = "1.0"
clap = { version = "4.5.42", features = ["derive", "env"] }
strum = { version = "0.27.2", features = ["derive"] }
tokio = { version = "*", features = [ "full" ] }
futures = "0.3"

tracing = { version = "0.1.41", features = ["log"] }
tracing-subscriber = { version = "0.3.17", features = ["fmt", "env-filter"] }

gpsrs-proto = "*"
rtcm-rs = { version = "0.11.0", features=["serde"] }
gnss-rs = "2.4.1"
geoutils = { version = "0.5.1", features = [ "serde" ] }
isocountry = "*"
rust_iso3166 = "0.1.14"
bytes = "*"
reqwest = { version = "*" }
hyper = { version = "*", features = [ "full" ] }
hyper-util = { version = "*", features = [ "full" ] }
serialport5 = "5.0.2"
http = "*"
crc-any = "*"
bytebuffer = "*"
base64 = "*"
tokio-rustls = "*"
rustls = "*"
webpki-roots = "1.0.2"
thiserror = "1.0"

[[bin]]
name = "gpsd"
path = "src/bin/gpsd.rs"

[[bin]]
name = "ntrip-tool"
path = "src/bin/ntrip.rs"
