[package]
name = "gpsrs-daemon"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.98"
serde = { version = "1.0.189", default-features = false, features = [ "derive" ] }
toml = { version = "0.9.5" }
serde_json = "1.0"
clap = { version = "4.5.42", features = ["derive", "env"] }
strum = { version = "0.27.2", features = ["derive"] }
tokio = { version = "*", features = [ "full" ] }
futures = "0.3"

tracing = { version = "0.1.41", features = ["log"] }
tracing-subscriber = { version = "0.3.17", default-features = false, features = ["fmt", "env-filter"] }

gpsrs-proto = "*"
rtcm-rs = { version = "0.11.0", features=["serde"] }
gnss-rs = "2.4.1"
geoutils = "0.5.1"
#ntrip-client = "0.0.1"
robust-ntrip-client = "0.1.0"
isocountry = "*"
rust_iso3166 = "0.1.14"
bytes = "*"

[[bin]]
name = "gpsd"
path = "src/bin/gpsd.rs"

[[bin]]
name = "ntrip-tool"
path = "src/bin/ntrip.rs"
