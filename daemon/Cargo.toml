[package]
name = "rgpsd"
description = "RGPSD - A GPS + RTK + NTRIP Daemon in Rust"
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true

[package.metadata.deb]
name = "rgpsd"
maintainer = "ryan kurte <ryan@kurte.nz>"
assets = [
    ["target/release/rgpsd", "usr/local/bin/", "755"],
    ["rgpsd.toml", "etc/rgpsd/", "644"],
]
maintainer-scripts = "scripts/"
systemd-units = { enable = false, unit-name = "rgpsd" }
depends = [
    "libssl",
    "libudev",
]

[dependencies]
anyhow = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }
serde_json = { workspace = true }
clap = { workspace = true, features = ["env"] }
strum = { workspace = true }
tokio = { workspace = true }
futures = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

geoutils = { workspace = true }
isocountry = { workspace = true }
rust_iso3166 = { workspace = true }
bytes = { workspace = true }
reqwest = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
http = { workspace = true }
crc-any = { workspace = true }
bytebuffer = { workspace = true }
base64 = { workspace = true }
tokio-rustls = { workspace = true }
tokio-stream = { workspace = true }
rustls = { workspace = true }
webpki-roots = { workspace = true }
thiserror = { workspace = true }
serialport5 = { workspace = true }
tokio-serial = { workspace = true }

rgps = { workspace = true }

rtcm-rs = { workspace = true }
gnss-rs = { workspace = true }
gnss-protos = { workspace = true }
ublox = { workspace = true }
nmea = { workspace = true }
ntrip-client = { workspace = true }
tokio-connectors = { workspace = true }
gpsd_proto = { workspace = true, features = [ "serialize" ] }

[[bin]]
name = "rgpsd"
path = "src/bin/rgpsd.rs"
