name: CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v2
    - uses: FranzDiebold/github-env-vars-action@v1.2.1

    - name: Configure toolchain
      uses: actions-rust-lang/setup-rust-toolchain@v1.16.1
      with:
        toolchain: stable
        override: true

    - name: Install binstall
      uses: cargo-bins/cargo-binstall@main

    - name: Install nextest
      run: cargo binstall cargo-nextest --secure

    - name: Run tests
      run: cargo nextest run --workspace --all-features

  build-daemon:
    runs-on: ${{ matrix.os }}
    continue-on-error: true

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            use_cross: true
          - target: armv7-unknown-linux-gnueabihf 
            os: ubuntu-latest
            use_cross: true
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            use_cross: true
          - target: aarch64-apple-darwin
            os: macos-latest
            use_cross: false

    steps:
    - uses: actions/checkout@v2
    - uses: FranzDiebold/github-env-vars-action@v1.2.1
      
    - name: Configure toolchain
      uses: actions-rust-lang/setup-rust-toolchain@v1.16.1
      with:
        toolchain: nightly
        target:  ${{ matrix.target }}
        override: true

    - name: Install binstall
      uses: cargo-bins/cargo-binstall@main

    - name: Install cross
      if: ${{ matrix.use_cross == 'true' }}
      run: cargo binstall cross

    - name: Install cargo deb
      run: cargo binstall cargo-deb

    - name: Build daemon
      if: ${{ matrix.use_cross == 'false' }}
      run: cross build --manifest-path daemon/Cargo.toml --target ${{ matrix.target }} --release

    - name: Copy and archive binary
      run: |
        cp target/${{ matrix.target }}/release/rgpsd rgpsd-${{ matrix.target }}
        tar -czvf rgpsd-${{ matrix.target }}.tgz rgpsd-${{ matrix.target }}

    - name: Package daemon (ubuntu targets)
      if: ${{ matrix.os == 'ubuntu-latest' }}
      run: cargo deb --manifest-path daemon/Cargo.toml --target ${{ matrix.target }} --release --no-build

    - name: Upload artifacts
      uses: actions/upload-artifact@v1
      with:
        name: rgpsd-${{ matrix.target }}
        path: 
            rgpsd-*.deb
            rgpsd-${{ matrix.target }}.tgz

    - name: Upload binary archive to release
      if: ${{ startsWith(github.ref, 'refs/tags/v') }}
      uses: svenstaro/upload-release-action@v2
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: rgpsd-${{ matrix.target }}.tgz
        asset_name: rgpsd-${{ matrix.target }}.tgz
        tag: ${{ github.ref }}
        overwrite: true

    - name: Upload .deb package to release
      if: ${{ startsWith(github.ref, 'refs/tags/v') && matrix.os == 'ubuntu-latest' }}
      uses: svenstaro/upload-release-action@v2
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: rgpsd-*.deb
        asset_name: rgpsd-${{ matrix.target }}.deb
        tag: ${{ github.ref }}
        overwrite: true

  release:
    name: Create release on tag
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:

      - name: Create Release
        uses: actions/create-release@v1
        id: create_release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} 
        with:
          tag_name: ${{ github.ref }}
          release_name: Release ${{ github.ref }}
          body: Release ${{ github.ref }}

