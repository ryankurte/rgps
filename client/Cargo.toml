[package]
name = "rgps-client"
description = "RGPSC - A client (and CLI) for interacting with the RGPSD GPS Daemon"
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true

[package.metadata.deb]
name = "rgpsc"
maintainer = "ryan kurte <ryan@kurte.nz>"
assets = [
    ["target/release/rgpsc", "usr/local/bin/", "755"],
]

[dependencies]
anyhow = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }
serde_json = { workspace = true }
clap = { workspace = true }
futures = { workspace = true }
humantime = { workspace = true }
strum = { workspace = true }
tokio = { workspace = true }
tokio-connectors = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
nmea = { workspace = true }

rgps-core = { workspace = true }

[[bin]]
name = "rgpsc"
path = "src/bin/rgpsc.rs"
