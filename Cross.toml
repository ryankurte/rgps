# Add architecture-specific dependencies for cross-compilation targets

[target.aarch64-unknown-linux-gnu]
pre-build = [
    "dpkg --add-architecture arm64",
    "apt-get update && apt-get install --assume-yes libudev-dev:arm64 libssl-dev:arm64"
]

[target.armv7-unknown-linux-gnueabihf]
pre-build = [
    "dpkg --add-architecture armhf",
    "apt-get update && apt-get install --assume-yes libudev-dev:armhf libssl-dev:armhf"
]
