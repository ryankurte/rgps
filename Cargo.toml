
[workspace]
resolver = "3"
members = [ "core", "daemon", "client" ]

[workspace.package]
version = "0.2.1"
edition = "2024"
repository = "https://github.com/ryankurte/rgpsd"
license = "GPL-3.0-or-later"

[workspace.dependencies]
anyhow = "1.0.102"
serde = { version = "1.0.228", default-features = false, features = ["derive", "std"] }
toml = { version = "0.9.12" }
serde_json = "1.0.149"
clap = { version = "4.6.1", features = ["derive", "string", "env"] }
strum = { version = "0.27.2", features = ["derive"] }
tracing = { version = "0.1.44", features = ["log"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "env-filter"] }
enumset = { version = "1.1.13", features = ["serde", "alloc"] }

axum = "0.7.0"
futures = "0.3.32"
geoutils = { version = "0.5.1", features = ["serde"] }
isocountry = "0.3.2"
rust_iso3166 = "0.1.14"
bytes = "1.11.1"
reqwest = { version = "0.13.3" }
hyper = { version = "1.9.0", features = ["full"] }
hyper-util = { version = "0.1.20", features = ["full"] }
http = "1.4.0"
crc-any = "2.5.0"
bytebuffer = "2.3.0"
base64 = "0.22.1"
humantime = "2.3.0"
tokio = { version = "1.52.3", features = [ "full" ] }
tokio-rustls = "0.26.4"
tokio-stream = "0.1.18"
console-subscriber = "0.5.0"
rustls = "0.23.40"
webpki-roots = "1.0.7"
thiserror = "1.0.69"
serialport5 = "5.0.2"
tokio-serial = "5.4.5"
rtcm-rs = { version = "0.11.0", features = ["serde"] }
gnss-rs = "2.6.0"
gnss-protos = { version = "0.0.2", features = ["gps"] }
ublox = { version = "0.6.0", default-features = false, features = ["std", "sfrbx-gps", "ubx_proto23"] }
nmea = { version = "0.7.0", features = ["serde"] }
ntrip-client = "0.2.1"
tokio-connectors = "0.1.6"
gpsd_proto = "1.0.0"

rgps-core = "0.2.0"
rgps-daemon = "0.2.0"
rgps-client = "0.2.0"

[patch.crates-io]
# Patches allowing us to do local development
rgps-core = { path = "./core" }
rgps-daemon = { path = "./daemon" }
rgps-client = { path = "./client" }

#ntrip-client = { path = "../ntrip-client" }
#nmea = { path = "../nmea" }
#gpsd_proto = { path = "../gpsd_proto" }

# Patches to update dependencies with fixes/changes that haven't been released yet
#ntrip-client = { git = "https://github.com/nav-solutions/ntrip-client", branch = "main" }
#nmea = { git = "https://github.com/AeroRust/nmea", branch = "main" }
#postcard = { git = "https://github.com/jamesmunns/postcard", branch = "main" }

#tokio-connectors = { path = "../../tokio-connectors" }

[profile.release]
strip = true
